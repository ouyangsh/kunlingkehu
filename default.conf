server {
    listen 80;
    server_name localhost;

    # Handle the /hello-unibest path
    location /hello-unibest {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /hello-unibest/index.html;
    }

    # Redirect root to /hello-unibest/ for convenience
    location = / {
        return 301 $scheme://$host/hello-unibest/;
    }
}
